name: CICD

on:
  push:
    paths: "*.py"

jobs:
    code:
      runs-on: ubuntu-latest
      steps:
        - name: Cloning the code
          uses: actions/checkout@v7
          
        - name: Install the linter
          run: pip install ruff
          
        - name: Run the linter
          run: ruff check . --fix
          
